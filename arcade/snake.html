<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Такопи-змейка</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="game.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<a class="back" href="index.html">← игры</a>
<canvas id="game"></canvas>
<script src="engine.js"></script>
<script>
const ID = "snake", CELL = 22, COLS = 15, ROWS = 23;
const LEFT = (W - COLS * CELL) / 2, TOP = 102, BW = COLS * CELL, BH = ROWS * CELL;
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", KeyW: "up", KeyS: "down", KeyA: "left", KeyD: "right" };
let state = "title", overT = 0, score = 0, best = getBest(ID), eaten = 0, clock = 0;
let snake = [], prev = [], dir = "up", queue = [], food = null, gold = null, stepT = 0, stepEvery = 0.16, grow = 0;
let look = [0, -1], eatPulse = 0, deadT = 0, newBest = false;

const cx = gx => LEFT + gx * CELL + CELL / 2;
const cy = gy => TOP + gy * CELL + CELL / 2;
const stars = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, ph: Math.random() * 6 }));
// травинки на поле
const tufts = Array.from({ length: 34 }, () => ({ x: LEFT + 6 + Math.random() * (BW - 12), y: TOP + 8 + Math.random() * (BH - 12), s: 0.7 + Math.random() * 0.6 }));

function occupied(c) {
  return snake.some(s => s.x === c.x && s.y === c.y) || (food && food.x === c.x && food.y === c.y) || (gold && gold.x === c.x && gold.y === c.y);
}
function freeCell() {
  for (let i = 0; i < 500; i++) {
    const c = { x: Math.floor(rand(0, COLS)), y: Math.floor(rand(0, ROWS)) };
    if (!occupied(c)) return c;
  }
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!occupied({ x, y })) return { x, y };
  return { x: 0, y: 0 };
}
function start() {
  state = "play"; score = 0; eaten = 0; stepT = 0; stepEvery = 0.16; grow = 0; deadT = 0; newBest = false;
  snake = [{ x: 7, y: 15 }, { x: 7, y: 16 }, { x: 7, y: 17 }];
  prev = snake.map(s => ({ ...s }));
  dir = "up"; queue = []; look = [0, -1];
  food = null; gold = null; food = { ...freeCell(), born: clock };
  Sound.start();
}
function turn(d) {
  if (state !== "play") return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (d === last) return;
  const [ax, ay] = DIRS[last], [bx, by] = DIRS[d];
  if (ax + bx === 0 && ay + by === 0) return;   // разворот на 180° запрещён
  if (queue.length < 2) queue.push(d);
}
function tryStart() { if (state === "title" || (state === "over" && overT > 0.9)) start(); }
on("swipe", d => { if (state !== "play") return tryStart(); turn(d); });
on("tap", (x, y) => {
  if (state !== "play") return tryStart();
  // тап по экрану поворачивает в сторону тапа (поперёк текущего движения)
  const last = queue.length ? queue[queue.length - 1] : dir;
  const h = headPos(), dx = x - h[0], dy = y - h[1];
  turn(DIRS[last][0] !== 0 ? (dy < 0 ? "up" : "down") : (dx < 0 ? "left" : "right"));
});
on("key", c => {
  if (KEYS[c]) { if (state === "play") turn(KEYS[c]); else tryStart(); }
  if (c === "Space" || c === "Enter") tryStart();
});

function die() {
  state = "over"; overT = 0; deadT = 0;
  prev = snake.map(s => ({ ...s }));
  newBest = score > best; best = saveBest(ID, score);
  const hx = cx(snake[0].x) + DIRS[dir][0] * CELL * 0.5, hy = cy(snake[0].y) + DIRS[dir][1] * CELL * 0.5;
  shake(1); Sound.explode(); Sound.hurt();
  setTimeout(() => Sound.lose(), 350);
  burst(hx, hy, 34, [COLORS.pink, COLORS.pinkL, COLORS.yellow, COLORS.white], { speed: 240, gravity: 220 });
  burst(hx, hy, 10, ["#ffffff"], { speed: 120, size: 5, gravity: 0, life: 0.4 });
}

function step() {
  prev = snake.map(s => ({ ...s }));
  const before = dir;
  if (queue.length) dir = queue.shift();
  if (dir !== before) Sound.tick();
  const [dx, dy] = DIRS[dir];
  const head = { x: snake[0].x + dx, y: snake[0].y + dy };
  const body = grow > 0 ? snake : snake.slice(0, -1);   // хвост уезжает, если не растём
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || body.some(s => s.x === head.x && s.y === head.y)) return die();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10; grow += 1; eaten++; eatPulse = 1;
    Sound.coin();
    floatText("+10", cx(head.x), cy(head.y) - 16, COLORS.yellow, 18);
    burst(cx(head.x), cy(head.y), 14, ["#e8a14a", "#f2b862", "#6b3a1f", "#fff3c4"], { speed: 150, size: 3.2, gravity: 260 });
    stepEvery = Math.max(0.07, stepEvery - 0.004);
    if (eaten % 5 === 0) {   // каждые 5 печенек — новая скорость
      Sound.melody([660, 880, 1175], 0.07, { type: "triangle", vol: 0.12 });
      floatText("Быстрее!", W / 2, TOP + 60, COLORS.cyan, 28);
    }
    food = null; food = { ...freeCell(), born: clock };
    if (!gold && Math.random() < 0.2) {
      gold = { ...freeCell(), t: 6, born: clock };
      Sound.melody([1568, 2093], 0.05, { type: "sine", vol: 0.08 });
    }
  }
  if (gold && head.x === gold.x && head.y === gold.y) {
    score += 50; grow += 3; eatPulse = 1.4;
    Sound.power(); shake(0.35);
    floatText("+50", cx(head.x), cy(head.y) - 18, "#ffe27a", 26);
    burst(cx(head.x), cy(head.y), 30, [COLORS.yellow, "#fff6b0", COLORS.orange, COLORS.white], { speed: 230, size: 3.6, gravity: 120 });
    gold = null;
  }
  if (grow > 0) grow--; else snake.pop();
}

// доля пути между клетками для плавного движения
const stepK = () => state === "play" ? clamp(stepT / stepEvery, 0, 1) : 1;
function headPos() {
  if (!snake.length) return [W / 2, H / 2];
  const k = stepK();
  return [lerp(cx(prev[0].x), cx(snake[0].x), k), lerp(cy(prev[0].y), cy(snake[0].y), k)];
}

const game = {
  start,
  update(dt) {
    clock += dt;
    eatPulse = Math.max(0, eatPulse - dt * 4);
    if (state !== "play") { overT += dt; deadT += dt; return; }
    if (gold) {
      gold.t -= dt;
      if (gold.t <= 0) {
        burst(cx(gold.x), cy(gold.y), 10, ["#fff6b0", COLORS.yellow], { speed: 70, gravity: -40, size: 2.5 });
        Sound.tone(700, 0.18, { type: "sine", vol: 0.07, slide: -350 });
        gold = null;
      }
    }
    // глаза плавно поворачиваются к направлению
    const [tx, ty] = DIRS[queue.length ? queue[0] : dir];
    look[0] = lerp(look[0], tx, Math.min(1, dt * 14)); look[1] = lerp(look[1], ty, Math.min(1, dt * 14));
    stepT += dt;
    while (stepT >= stepEvery && state === "play") { stepT -= stepEvery; step(); }
  },
  draw(t) {
    // фон
    ctx.fillStyle = vgrad(0, H, ["#120f33", "#24195a", "#3a2470"]);
    ctx.fillRect(0, 0, W, H);
    stars.forEach(s => { ctx.globalAlpha = 0.45 + Math.sin(t * 2 + s.ph) * 0.35; circle(s.x, s.y, s.r, COLORS.white); });
    ctx.globalAlpha = 1;
    // рамка поля
    rrect(LEFT - 8, TOP - 8 + 6, BW + 16, BH + 16, 22, "rgba(0,0,0,0.4)");
    rrect(LEFT - 8, TOP - 8, BW + 16, BH + 16, 22, vgrad(TOP, TOP + BH, ["#8f7ad8", "#5b47a8"]));
    rrect(LEFT - 4, TOP - 7, BW + 8, 4, 2, "rgba(255,255,255,0.22)");
    ctx.save();
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(LEFT, TOP, BW, BH, 14); else ctx.rect(LEFT, TOP, BW, BH); ctx.clip();
    ctx.fillStyle = vgrad(TOP, TOP + BH, ["#4bb06a", "#3a9a5a"]); ctx.fillRect(LEFT, TOP, BW, BH);
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if ((x + y) % 2) ctx.fillRect(LEFT + x * CELL, TOP + y * CELL, CELL, CELL);
    ctx.strokeStyle = "rgba(30,90,50,0.55)"; ctx.lineWidth = 1.5; ctx.lineCap = "round";
    for (const g of tufts) {
      ctx.beginPath();
      ctx.moveTo(g.x - 3 * g.s, g.y); ctx.lineTo(g.x - 4 * g.s, g.y - 5 * g.s);
      ctx.moveTo(g.x, g.y); ctx.lineTo(g.x, g.y - 7 * g.s);
      ctx.moveTo(g.x + 3 * g.s, g.y); ctx.lineTo(g.x + 4 * g.s, g.y - 5 * g.s);
      ctx.stroke();
    }
    // внутренняя тень по краю
    const vg = ctx.createRadialGradient(W / 2, TOP + BH / 2, BH * 0.35, W / 2, TOP + BH / 2, BH * 0.62);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(10,30,20,0.35)");
    ctx.fillStyle = vg; ctx.fillRect(LEFT, TOP, BW, BH);

    if (state === "title") { drawDemo(t); ctx.restore(); return; }

    drawCookie(cx(food.x), cy(food.y), t, clamp((clock - food.born) * 5, 0, 1));
    if (gold) drawGold(cx(gold.x), cy(gold.y), t);
    drawSnake(t);
    ctx.restore();
    drawParticles();

    text("Длина: " + snake.length, LEFT + 4, TOP + BH + 20, { size: 14, color: COLORS.muted, align: "left", shadow: false });
    text("Скорость " + (1 + Math.floor(eaten / 5)), LEFT + BW - 4, TOP + BH + 20, { size: 14, color: COLORS.muted, align: "right", shadow: false });
  },
  drawUI(t) {
    if (state === "title") {
      card({ title: "ТАКОПИ-ЗМЕЙКА", lines: ["Свайп, стрелки или тап — поворот", "Печенька: +1 к хвосту", ["Золотая: +3 и +50 очков!", COLORS.yellow]],
             hint: "Нажми, чтобы начать", y: 300, dim: false });
      text("Рекорд: " + best, W / 2, 590, { size: 16, color: COLORS.ink, stroke: 4 });
      return;
    }
    hudPill(14, 56, "очки", score, COLORS.ink, "left");
    hudPill(W - 14, 56, "★", best, COLORS.yellow, "right");
    if (state === "over" && overT > 0.45) {
      card({ title: "БУМ, ПИ!", lines: ["Очки: " + score, "Длина: " + snake.length,
        [newBest ? "Новый рекорд!" : "Рекорд: " + best, COLORS.yellow]], hint: overT > 0.9 ? "Нажми — ещё раз" : "", y: 210 });
    }
  },
};

function drawCookie(x, y, t, pop) {
  const bob = Math.sin(t * 4 + x * 0.1) * 1.5, s = pop * (1 + Math.sin(t * 6) * 0.04);
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(0, 10 - bob, 8, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  circle(0, 0, 15, "rgba(255,200,80,0.2)");
  circle(0, 0, 10, "#e8a14a"); circle(-1.5, -1.5, 8.5, "#f2b862");
  for (const [dx, dy] of [[-3, -3], [3, -1], [-1, 4], [4, 4]]) circle(dx, dy, 1.6, "#6b3a1f");
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.ellipse(-4, -5, 3, 1.6, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawGold(x, y, t) {
  const blink = gold.t > 2 || Math.floor(t * 10) % 2;
  const g = ctx.createRadialGradient(x, y, 2, x, y, 26);
  g.addColorStop(0, "rgba(255,230,120,0.6)"); g.addColorStop(1, "rgba(255,230,120,0)");
  ctx.fillStyle = g; ctx.fillRect(x - 26, y - 26, 52, 52);
  // кольцо-таймер
  ctx.strokeStyle = "rgba(255,240,170,0.85)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(gold.t / 6, 0, 1)); ctx.stroke();
  if (!blink) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 3) * 0.2);
  const s = 1 + Math.sin(t * 8) * 0.06; ctx.scale(s, s);
  const cg = ctx.createRadialGradient(-3, -3, 1, 0, 0, 11);
  cg.addColorStop(0, "#fff8c8"); cg.addColorStop(0.5, "#ffd84a"); cg.addColorStop(1, "#d99a1c");
  circle(0, 0, 10.5, cg);
  for (const [dx, dy] of [[-3, -3], [3, -1], [-1, 4], [4, 4]]) circle(dx, dy, 1.5, "#b87412");
  ctx.restore();
  for (let i = 0; i < 3; i++) {
    const a = t * 2 + i * 2.1, r = 16 + Math.sin(t * 5 + i) * 2, k = 0.5 + Math.sin(t * 7 + i * 2) * 0.5;
    sparkle(x + Math.cos(a) * r, y + Math.sin(a) * r, 2 + k * 2.5);
  }
}
function sparkle(x, y, r) {
  ctx.fillStyle = "#fffbe0"; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.3, y - r * 0.3); ctx.lineTo(x + r, y); ctx.lineTo(x + r * 0.3, y + r * 0.3);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.3, y + r * 0.3); ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.3, y - r * 0.3);
  ctx.closePath(); ctx.fill();
}

// тело: штрихи по пути, сужаются к хвосту
function strokeBody(pts, width, flash) {
  const m = pts.length;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const seg = (j, w, col, ox, oy) => {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(pts[j][0] + ox, pts[j][1] + oy); ctx.lineTo(pts[j - 1][0] + ox, pts[j - 1][1] + oy); ctx.stroke();
  };
  for (let j = m - 1; j > 0; j--) seg(j, width(j - 1) + 2, "#2f7d48", 2, 5);
  for (let j = m - 1; j > 0; j--) seg(j, width(j - 1) + 3.5, flash ? "#ffffff" : "#a8336f", 0, 0);
  for (let j = m - 1; j > 0; j--) seg(j, width(j - 1), flash ? "#ffffff" : COLORS.pink, 0, 0);
  for (let j = m - 1; j > 0; j--) seg(j, width(j - 1) * 0.32, "#ffbfdc", -1.8, -2.4);
}

function drawSnake(t) {
  const k = stepK(), n = snake.length;
  // путь тела: голова (между клетками) → центры клеток → хвост (между клетками)
  const head = headPos();
  const lt = prev[Math.min(n - 1, prev.length - 1)], tl = snake[n - 1];
  const pts = [head];
  for (let i = 1; i < n; i++) pts.push([cx(snake[i].x), cy(snake[i].y)]);
  if (n > 1) pts.push([lerp(cx(lt.x), cx(tl.x), k), lerp(cy(lt.y), cy(tl.y), k)]);
  const m = pts.length;
  const width = j => lerp(CELL * 0.82, CELL * 0.46, j / Math.max(1, m - 1));
  const flash = state === "over" && deadT < 0.6 && Math.floor(deadT * 12) % 2 === 0;
  strokeBody(pts, width, flash);
  // пятнышки едут вместе с телом
  for (let i = 2; i < n; i += 2) {
    const a = prev[Math.min(i, prev.length - 1)], b = snake[i];
    circle(lerp(cx(a.x), cx(b.x), k), lerp(cy(a.y), cy(b.y), k), width(i) * 0.18, "rgba(224,85,154,0.75)");
  }
  drawHead(head[0], head[1], t, flash);
}

function drawHead(hx, hy, t, flash) {
  const pulse = 1 + eatPulse * 0.18;
  ctx.save(); ctx.translate(hx, hy); ctx.scale(pulse, pulse);
  const r = CELL * 0.66;
  ctx.fillStyle = "rgba(0,40,20,0.25)"; ctx.beginPath(); ctx.ellipse(2, 6, r, r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createRadialGradient(-r * 0.4, -r * 0.5, 2, 0, 0, r * 1.15);
  g.addColorStop(0, "#ffd0e6"); g.addColorStop(0.5, flash ? "#ffffff" : COLORS.pink); g.addColorStop(1, COLORS.pinkD);
  circle(0, 0, r, g, "#a8336f", 2);
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.55, r * 0.3, r * 0.17, -0.5, 0, Math.PI * 2); ctx.fill();
  const [lx, ly] = look, fx = lx * 3.2, fy = ly * 3.2;   // лицо смещено в сторону движения
  ctx.fillStyle = "rgba(255,79,122,0.55)";
  ctx.beginPath(); ctx.ellipse(fx - 8, fy + 3.5, 3, 1.8, 0, 0, Math.PI * 2); ctx.ellipse(fx + 8, fy + 3.5, 3, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  if (state === "over") {
    ctx.strokeStyle = COLORS.black; ctx.lineWidth = 2; ctx.lineCap = "round";
    for (const ex of [-5, 5]) { ctx.beginPath(); ctx.moveTo(fx + ex - 2.5, fy - 5.5); ctx.lineTo(fx + ex + 2.5, fy - 0.5); ctx.moveTo(fx + ex + 2.5, fy - 5.5); ctx.lineTo(fx + ex - 2.5, fy - 0.5); ctx.stroke(); }
    ctx.fillStyle = "#b02a62"; ctx.beginPath(); ctx.ellipse(fx, fy + 5, 2.2, 2.6, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    const blink = (t % 3.4) > 3.28;
    for (const ex of [-5, 5]) {
      if (blink) { ctx.fillStyle = COLORS.black; ctx.fillRect(fx + ex - 3, fy - 3, 6, 1.6); continue; }
      circle(fx + ex, fy - 3, 3.8, COLORS.white);
      circle(fx + ex + lx * 1.5, fy - 3 + ly * 1.5, 2.1, COLORS.black);
      circle(fx + ex + lx * 1.5 + 0.8, fy - 3.8 + ly * 1.5, 0.8, COLORS.white);
    }
    ctx.strokeStyle = "#b02a62"; ctx.fillStyle = "#b02a62"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
    ctx.beginPath();
    if (eatPulse > 0.3) { ctx.ellipse(fx, fy + 4.5, 2.6, 2.6 * Math.min(1.2, eatPulse), 0, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.moveTo(fx - 3.5, fy + 3); ctx.quadraticCurveTo(fx, fy + 6.5, fx + 3.5, fy + 3); ctx.stroke(); }
  }
  ctx.restore();
}

// заставка: змейка ползает восьмёркой по полю
function drawDemo(t) {
  const pts = [];
  for (let i = 0; i < 46; i++) { const a = t * 1.4 - i * 0.075; pts.push([W / 2 + Math.cos(a) * 115, TOP + 110 + Math.sin(a * 2) * 50]); }
  strokeBody(pts, j => lerp(CELL * 0.82, CELL * 0.46, j / (pts.length - 1)), false);
  const a = t * 1.4, dx = -Math.sin(a), dy = Math.cos(a * 2) * 2 * 50 / 115, l = Math.hypot(dx, dy) || 1;
  look = [dx / l, dy / l];
  drawHead(pts[0][0], pts[0][1], t, false);
  drawCookie(W / 2 + 70, TOP + 40, t, 1);
}

run(game);
</script>
</body>
</html>
