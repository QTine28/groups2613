<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Такопи в космосе</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="game.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<a class="back" href="index.html">← игры</a>
<canvas id="game"></canvas>
<script src="engine.js"></script>
<script>
const ID = "space", PY = 548;
let state = "title", overT = 0, score = 0, best = getBest(ID), clock = 0;
let p, shots, foes, bullets, boosts, spawn, fire, wave, hurt, banner, scroll = 0, glowFlashes = [];

// фон: три слоя звёзд, туманности, планета с кольцом
const starLayers = [[60, 18, 0.7], [40, 45, 1.1], [18, 110, 1.7]].map(([n, v, r]) =>
  Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, v: v * (0.8 + Math.random() * 0.4), r: r * (0.6 + Math.random() * 0.6), ph: Math.random() * 6 })));

function glow(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalAlpha = 1;
}
function heart(x, y, s, color = COLORS.red) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
  ctx.beginPath(); ctx.moveTo(0, 7);
  ctx.bezierCurveTo(-12, -1, -9, -11, 0, -5); ctx.bezierCurveTo(9, -11, 12, -1, 0, 7);
  ctx.fillStyle = color; ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.beginPath(); ctx.ellipse(-4.5, -4.5, 2.4, 1.5, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// тарелка с Такопи под стеклянным куполом; x,y — центр корпуса
function drawSaucer(x, y, s, t, { tilt = 0, mood = "happy" } = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(s, s);
  // свечение двигателя
  glow(0, 14, 26 + Math.sin(t * 30) * 3, "rgba(255,170,70,0.85)");
  ctx.fillStyle = vgrad(8, 28 + Math.sin(t * 40) * 3, ["#fff3b0", "rgba(255,140,40,0.9)", "rgba(255,80,40,0)"]);
  ctx.beginPath(); ctx.moveTo(-9, 8); ctx.lineTo(9, 8); ctx.lineTo(0, 30 + Math.sin(t * 40) * 4); ctx.closePath(); ctx.fill();
  // купол: тёмное стекло, Такопи, блик
  ctx.save();
  ctx.beginPath(); ctx.arc(0, -4, 19, Math.PI, 0); ctx.closePath(); ctx.clip();
  ctx.fillStyle = vgrad(-23, -4, ["#5fd8ff", "#2a3f8f"]); ctx.fillRect(-20, -24, 40, 22);
  drawTakopi(0, -9, 31, { t, mood });
  ctx.fillStyle = "rgba(160,230,255,0.22)"; ctx.fillRect(-20, -24, 40, 22);
  ctx.restore();
  ctx.strokeStyle = "rgba(200,240,255,0.7)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, -4, 19, Math.PI, 0); ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.beginPath(); ctx.ellipse(-9, -16, 4.5, 2.2, -0.7, 0, Math.PI * 2); ctx.fill();
  // нижняя чаша
  ctx.fillStyle = vgrad(2, 14, ["#6e66b0", "#2c2860"]);
  ctx.beginPath(); ctx.ellipse(0, 5, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
  // корпус
  ctx.fillStyle = vgrad(-8, 8, ["#ffffff", "#c9c5ef", "#7f78c0", "#4a4489"]);
  ctx.beginPath(); ctx.ellipse(0, 0, 34, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath(); ctx.ellipse(-8, -4, 18, 2.2, 0, 0, Math.PI * 2); ctx.fill();
  // огоньки по краю
  const cols = [COLORS.pink, COLORS.yellow, COLORS.cyan];
  for (let i = 0; i < 7; i++) {
    const lx = -27 + i * 9, k = Math.floor(t * 8 + i) % 3;
    circle(lx, 2.5, 2.4, cols[k]);
    circle(lx - 0.6, 1.8, 0.8, "rgba(255,255,255,0.9)");
  }
  ctx.restore();
}

function drawRock(f) {
  ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
  ctx.beginPath();
  f.shape.forEach((k, i) => { const a = i / f.shape.length * Math.PI * 2; ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * f.r * k, Math.sin(a) * f.r * k); });
  ctx.closePath();
  const g = ctx.createRadialGradient(-f.r * 0.4, -f.r * 0.4, 2, 0, 0, f.r * 1.1);
  g.addColorStop(0, f.flash > 0 ? "#ffffff" : "#c9a98c"); g.addColorStop(0.55, f.flash > 0 ? "#ffd2b0" : "#8a6c58"); g.addColorStop(1, "#4a3830");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(255,230,200,0.25)"; ctx.lineWidth = 1.5; ctx.stroke();
  for (const [cx, cy, cr] of f.craters) {
    circle(cx * f.r, cy * f.r, cr * f.r, "rgba(50,34,28,0.45)");
    circle(cx * f.r - cr * f.r * 0.25, cy * f.r - cr * f.r * 0.25, cr * f.r * 0.6, "rgba(170,135,110,0.35)");
  }
  if (f.hp < f.maxHp) {   // трещина после попадания
    ctx.strokeStyle = "rgba(40,24,18,0.8)"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-f.r * 0.6, -f.r * 0.2); ctx.lineTo(-f.r * 0.1, f.r * 0.1); ctx.lineTo(f.r * 0.2, -f.r * 0.3); ctx.lineTo(f.r * 0.55, 0.1 * f.r); ctx.stroke();
  }
  ctx.restore();
}

function drawAlienShip(f, t) {
  // пришелец на реактивной платформе
  glow(f.x, f.y + 24, 20, "rgba(120,255,160,0.6)");
  ctx.fillStyle = vgrad(f.y + 12, f.y + 22, ["#9fffbf", "#2fa84f"]);
  ctx.beginPath(); ctx.ellipse(f.x, f.y + 17, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.ellipse(f.x - 6, f.y + 15, 10, 1.6, 0, 0, Math.PI * 2); ctx.fill();
  drawAlien(f.x, f.y, 38, { t: t + f.phase, hurt: f.flash > 0 });
  if (f.cd < 0.35 && f.y > 0) glow(f.x, f.y + 26, 12, "rgba(255,80,100,0.9)", 1 - f.cd / 0.35);
}

function start() {
  state = "play"; score = 0; wave = 1; spawn = 0.6; fire = 0; hurt = 0; banner = { t: 1.6, text: "ВОЛНА 1" };
  p = { x: W / 2, y: PY, vx: 0, lives: 3, triple: 0 };
  shots = []; foes = []; bullets = []; boosts = [];
  Sound.start();
}
function tapStart() { if (state === "title" || (state === "over" && overT > 0.8)) start(); }
on("down", tapStart);
on("key", c => { if (window.rulesOpen && rulesOpen()) return; if (c === "Space" || c === "Enter") tapStart(); });

function killFoe(f) {
  if (f.type === "alien") {
    score += 25; floatText("+25", f.x, f.y - 20, COLORS.green);
    burst(f.x, f.y, 22, [COLORS.green, "#b6ffc4", COLORS.yellow, COLORS.white], { speed: 220, gravity: 0, life: 0.6 });
    Sound.explode(); Sound.tone(660, 0.18, { type: "square", vol: 0.06, slide: -500 });
  } else {
    score += 10; floatText("+10", f.x, f.y - f.r, COLORS.yellow, 16);
    burst(f.x, f.y, 14 + f.r * 0.6 | 0, ["#c9a98c", "#8a6c58", COLORS.orange, "#ffe2b0"], { speed: 180, gravity: 0, life: 0.7, size: 4 });
    Sound.explode();
  }
  glowFlashes.push({ x: f.x, y: f.y, t: 0, r: f.type === "alien" ? 50 : f.r * 2.2 });
  shake(0.25);
  if (Math.random() < 0.09) boosts.push({ x: f.x, y: f.y, ph: Math.random() * 6 });
}

function hurtPlayer() {
  p.lives--; hurt = 1.6;
  burst(p.x, p.y, 26, [COLORS.pink, COLORS.pinkL, COLORS.yellow, COLORS.white], { speed: 240, gravity: 0 });
  if (p.lives <= 0) {
    state = "over"; overT = 0; best = saveBest(ID, score);
    shake(1.3); Sound.explode(true); setTimeout(() => Sound.lose(), 450);
    burst(p.x, p.y, 50, [COLORS.pink, COLORS.orange, COLORS.yellow, COLORS.white, COLORS.cyan], { speed: 320, gravity: 0, life: 1.1, size: 4.5 });
    glowFlashes.push({ x: p.x, y: p.y, t: 0, r: 120 });
  } else { shake(0.8); Sound.hurt(); floatText("-1 ♥", p.x, p.y - 40, COLORS.red, 20); }
}

const game = {
  start,
  update(dt) {
    clock += dt;
    const flySpeed = state === "play" ? 1 + wave * 0.08 : 0.5;
    scroll += 20 * dt * flySpeed;
    starLayers.forEach(l => l.forEach(s => { s.y += s.v * dt * flySpeed; if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; } }));
    glowFlashes.forEach(g => g.t += dt); glowFlashes = glowFlashes.filter(g => g.t < 0.35);
    if (state !== "play") { overT += dt; return; }

    // движение: палец тянет тарелку, или стрелки / A-D
    const px0 = p.x;
    if (input.down) p.x += (input.x - p.x) * Math.min(1, dt * 14);
    if (keys.ArrowLeft || keys.KeyA) p.x -= 330 * dt;
    if (keys.ArrowRight || keys.KeyD) p.x += 330 * dt;
    p.x = clamp(p.x, 36, W - 36);
    p.vx = lerp(p.vx, (p.x - px0) / Math.max(dt, 0.001), Math.min(1, dt * 10));
    if (Math.random() < dt * 30) particles.push({ x: p.x + rand(-5, 5), y: p.y + 22, vx: rand(-20, 20), vy: rand(90, 160), t: 0, life: 0.35, s: rand(2, 3.5), c: Math.random() < 0.5 ? COLORS.orange : COLORS.yellow, g: 0 });

    fire -= dt; p.triple -= dt; hurt -= dt; banner.t -= dt;
    if (fire <= 0) {
      fire = 0.2;
      shots.push({ x: p.x, y: p.y - 22, vx: 0 });
      if (p.triple > 0) shots.push({ x: p.x - 10, y: p.y - 16, vx: -110 }, { x: p.x + 10, y: p.y - 16, vx: 110 });
      Sound.tone(p.triple > 0 ? 1500 : 1200, 0.07, { type: "square", vol: 0.035, slide: -800 });
    }
    shots.forEach(s => { s.y -= 560 * dt; s.x += s.vx * dt; });
    shots = shots.filter(s => s.y > -20 && s.x > -10 && s.x < W + 10);

    const nw = 1 + Math.floor(score / 300);
    if (nw > wave) { wave = nw; banner = { t: 1.6, text: "ВОЛНА " + wave }; Sound.melody([523, 659, 784, 1047], 0.08, { type: "triangle", vol: 0.12 }); }
    spawn -= dt;
    if (spawn <= 0) {
      if (Math.random() < 0.55) {
        const r = rand(16, 26) + Math.min(8, wave);
        foes.push({ type: "rock", x: rand(r, W - r), y: -r, r, vy: rand(80, 140) + wave * 12, vx: rand(-20, 20), hp: 2, maxHp: 2,
          rot: Math.random() * 6, vr: rand(-1.5, 1.5), flash: 0,
          shape: Array.from({ length: 11 }, () => rand(0.78, 1.08)),
          craters: Array.from({ length: 3 }, () => [rand(-0.45, 0.45), rand(-0.45, 0.45), rand(0.14, 0.24)]) });
      } else foes.push({ type: "alien", x: rand(30, W - 30), y: -30, r: 20, vy: 60 + wave * 8, hp: 1, phase: Math.random() * 6, cd: rand(1, 2.5), flash: 0 });
      spawn = Math.max(0.28, 1.1 - wave * 0.08);
    }
    foes.forEach(f => {
      f.y += f.vy * dt; f.flash -= dt;
      if (f.type === "rock") { f.rot += f.vr * dt; f.x += f.vx * dt; }
      else {
        f.x = clamp(f.x + Math.sin(clock * 2 + f.phase) * 80 * dt, 24, W - 24);
        f.cd -= dt;
        if (f.cd <= 0 && f.y > 20 && f.y < PY - 60) {
          f.cd = rand(1.5, 3);
          bullets.push({ x: f.x, y: f.y + 24, vx: clamp((p.x - f.x) * 0.25, -50, 50) * Math.min(1, wave / 4), vy: 220 + wave * 6 });
          Sound.tone(420, 0.12, { type: "sawtooth", vol: 0.05, slide: -250 });
        }
      }
    });
    bullets.forEach(b => { b.x += b.vx * dt; b.y += b.vy * dt; }); bullets = bullets.filter(b => b.y < H + 10);
    boosts.forEach(b => { b.y += 100 * dt; b.ph += dt; }); boosts = boosts.filter(b => b.y < H + 20);

    shots = shots.filter(s => {
      const f = foes.find(f => f.hp > 0 && Math.hypot(s.x - f.x, s.y - f.y) < f.r + 4);
      if (!f) return true;
      f.hp--; f.flash = 0.08;
      burst(s.x, s.y, 5, [COLORS.cyan, COLORS.white], { speed: 110, gravity: 0, life: 0.3, size: 2.5 });
      if (f.hp <= 0) killFoe(f);
      else Sound.tone(260 + f.hp * 60, 0.06, { type: "triangle", vol: 0.12, slide: -80 });
      return false;
    });
    foes = foes.filter(f => f.hp > 0 && f.y < H + 40);

    boosts = boosts.filter(b => {
      if (Math.hypot(b.x - p.x, b.y - p.y) > 34) return true;
      p.triple = 8;
      Sound.power(); floatText("Тройной выстрел!", clamp(p.x, 90, W - 90), p.y - 50, COLORS.yellow, 18);
      burst(b.x, b.y, 20, [COLORS.yellow, COLORS.orange, COLORS.white], { speed: 180, gravity: 0 });
      return false;
    });
    if (hurt <= 0) {
      const f = foes.find(f => Math.abs(f.x - p.x) < f.r * 0.85 + 28 && Math.abs(f.y - p.y) < f.r * 0.85 + 10);
      const b = bullets.find(b => Math.abs(b.x - p.x) < 30 && Math.abs(b.y - p.y) < 14);
      if (f) { f.hp = 0; killFoe(f); foes = foes.filter(x => x !== f); }
      if (b) bullets = bullets.filter(x => x !== b);
      if (f || b) hurtPlayer();
    }
  },
  draw(t) {
    // космос
    ctx.fillStyle = vgrad(0, H, ["#05041a", "#140d3c", "#2a1450", "#120a2c"]);
    ctx.fillRect(0, 0, W, H);
    const ny = (scroll * 0.6) % (H + 400) - 200;
    glow(80, ny, 220, "rgba(255,90,170,0.22)");
    glow(290, (ny + 620) % (H + 400) - 200, 240, "rgba(80,200,255,0.18)");
    glow(200, (ny + 860) % (H + 400) - 200, 200, "rgba(165,140,255,0.2)");
    starLayers.forEach((l, li) => l.forEach(s => {
      ctx.globalAlpha = clamp(0.45 + li * 0.2 + Math.sin(t * 3 + s.ph) * 0.2, 0, 1);
      if (li === 2) rrect(s.x - s.r / 2, s.y - 6, s.r, 12, s.r / 2, COLORS.white);
      else circle(s.x, s.y, s.r, li ? COLORS.white : "#c9c0ff");
    }));
    ctx.globalAlpha = 1;
    // планета с кольцом, медленно проплывает
    const py = (scroll * 1.1 + 260) % (H + 300) - 150, pxp = 270;
    glow(pxp, py, 110, "rgba(255,150,120,0.25)");
    ctx.strokeStyle = "rgba(255,210,170,0.45)"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(pxp, py, 78, 16, -0.35, Math.PI, Math.PI * 2); ctx.stroke();
    const pg = ctx.createRadialGradient(pxp - 18, py - 18, 6, pxp, py, 52);
    pg.addColorStop(0, "#ffc59a"); pg.addColorStop(0.6, "#d0607a"); pg.addColorStop(1, "#4a1e5a");
    circle(pxp, py, 46, pg);
    ctx.save(); ctx.beginPath(); ctx.arc(pxp, py, 46, 0, Math.PI * 2); ctx.clip();
    for (let i = 0; i < 4; i++) rrect(pxp - 60, py - 30 + i * 16, 120, 5, 2.5, "rgba(255,255,255,0.08)");
    ctx.restore();
    ctx.strokeStyle = "rgba(255,210,170,0.45)"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(pxp, py, 78, 16, -0.35, 0, Math.PI); ctx.stroke();

    if (state === "title") {
      drawSaucer(W / 2, 190 + Math.sin(t * 2.5) * 8, 2.1, t, { tilt: Math.sin(t * 1.7) * 0.08 });
      card({ title: "", lines: ["Веди пальцем или ← →", "Тарелка стреляет сама", ["Жёлтая звезда — тройной выстрел", COLORS.yellow, 15]],
             hint: "Нажми, чтобы начать", y: 300, dim: false });
      text("ТАКОПИ В КОСМОСЕ", W / 2, 346, { size: 26, weight: 900, color: COLORS.pink, stroke: 6 });
      text("Рекорд: " + best, W / 2, 600, { size: 16, color: COLORS.muted, shadow: false });
      return;
    }
    // бонусы
    for (const b of boosts) {
      const s = 1 + Math.sin(b.ph * 6) * 0.08;
      glow(b.x, b.y, 30, "rgba(255,216,74,0.7)");
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ph * 1.5); ctx.scale(s, s);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 7 : 16; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fillStyle = vgrad(-15, 15, ["#fff3b0", COLORS.yellow, COLORS.orange]); ctx.fill();
      ctx.restore();
      text("x3", b.x, b.y + 1, { size: 11, weight: 900, color: "#7a3a00", shadow: false });
    }
    foes.forEach(f => f.type === "rock" ? drawRock(f) : drawAlienShip(f, t));
    // вражеские снаряды
    for (const b of bullets) { glow(b.x, b.y, 14, "rgba(255,70,100,0.8)"); circle(b.x, b.y, 5, COLORS.red); circle(b.x - 1, b.y - 1, 2.4, "#ffd0d6"); }
    // наши выстрелы и вспышки
    ctx.globalCompositeOperation = "lighter";
    for (const s of shots) {
      const tri = s.vx !== 0;
      glow(s.x, s.y, 12, tri ? "rgba(255,216,74,0.55)" : "rgba(95,240,240,0.55)");
      rrect(s.x - 2.5, s.y - 9, 5, 18, 2.5, tri ? "#ffe58a" : "#9ffcff");
      rrect(s.x - 1, s.y - 7, 2, 14, 1, COLORS.white);
    }
    for (const g of glowFlashes) glow(g.x, g.y, g.r * (0.6 + g.t * 2), "rgba(255,200,120,0.9)", 1 - g.t / 0.35);
    ctx.globalCompositeOperation = "source-over";
    drawParticles();
    // игрок
    if (state === "play" && (hurt <= 0 || Math.floor(clock * 14) % 2)) {
      if (p.triple > 0) {
        ctx.globalAlpha = 0.35 + Math.sin(t * 10) * 0.15;
        circle(p.x, p.y - 4, 44, null, COLORS.yellow, 2); ctx.globalAlpha = 1;
      }
      drawSaucer(p.x, p.y, 1, t, { tilt: clamp(p.vx / 1600, -0.3, 0.3), mood: hurt > 0.8 ? "oh" : "happy" });
    }
  },
  drawUI(t) {
    if (state === "title") return;
    // жизни
    rrect(14, 56, 92, 34, 17, "rgba(10,8,30,0.55)");
    for (let i = 0; i < 3; i++) heart(34 + i * 26, 74, 22, i < p.lives ? COLORS.red : "rgba(255,255,255,0.15)");
    hudPill(W / 2 + 8, 56, "очки", score, COLORS.ink, "center");
    hudPill(W - 14, 56, "★", best, COLORS.yellow, "right");
    if (state === "play" && p.triple > 0) {
      rrect(14, 98, 92, 22, 11, "rgba(10,8,30,0.55)");
      rrect(18, 102, 84 * Math.min(1, p.triple / 8), 14, 7, vgrad(102, 116, ["#fff3b0", COLORS.orange]));
      text("x3", 60, 110, { size: 12, weight: 900, color: "#3a1a00", shadow: false });
    }
    if (state === "play" && banner.t > 0) {
      const a = Math.min(1, banner.t * 2.5), k = 1 + Math.max(0, banner.t - 1.3) * 1.5;
      ctx.globalAlpha = a;
      ctx.save(); ctx.translate(W / 2, 250); ctx.scale(k, k);
      text(banner.text, 0, 0, { size: 38, weight: 900, color: COLORS.cyan, stroke: 7 });
      ctx.restore(); ctx.globalAlpha = 1;
    }
    if (state === "over") {
      card({ title: "КОНЕЦ ИГРЫ", lines: ["Очки: " + score, [score >= best && score > 0 ? "Новый рекорд!" : "Рекорд: " + best, COLORS.yellow], ["Волна: " + wave, COLORS.cyan]],
             hint: overT > 0.8 ? "Нажми — ещё раз" : "", y: 220 });
      drawTakopi(W / 2, 178, 72, { t, mood: "ko" });
    }
  },
};
run(game);
</script>
</body>
</html>
