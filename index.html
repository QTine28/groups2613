<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Предметы и преподаватели</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#1c2640; --ink:#eaf0ff; --muted:#a3aed0; --line:rgba(160,175,225,.22); --card:rgba(255,255,255,.055);
  --w:clamp(28px,10vw,230px); --accent:#9db0ff; --wa:#238a52; --tg:#2478ad;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Manrope","Segoe UI",system-ui,sans-serif;line-height:1.5;padding-left:var(--w)}
.waves{position:fixed;left:0;top:0;height:100%;width:var(--w);filter:drop-shadow(8px 0 14px rgba(0,0,0,.5));pointer-events:none}
.waves svg{display:block;width:100%;height:100%}
main{max-width:720px;margin:0 auto;padding:40px 16px 56px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.top{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
#search{flex:1;min-width:180px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
#schbtn,#conbtn{padding:12px 20px;border:0;border-radius:10px;background:var(--accent);color:#14193a;font:inherit;font-weight:800;cursor:pointer}
#search:focus-visible,summary:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .45s ease;flex:none;margin-top:-4px}
details[open] summary::after{transform:rotate(225deg);margin-top:4px}
details[open]{border-color:var(--accent)}
.info{overflow:hidden}
.inner{padding:2px 18px 18px;display:grid;gap:14px}
dl{margin:0;display:grid;gap:12px}
dt{font-size:13px;color:var(--muted);margin:0}
dd{margin:0;font-weight:600}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sched li{display:flex;gap:10px;font-weight:600}
.sched span{color:var(--muted);font-weight:500;min-width:96px}
.links{display:flex;flex-wrap:wrap;gap:10px;padding-top:4px}
.ic{width:18px;height:18px;flex:none}
.links a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.wa{background:var(--wa)} .tg{background:var(--tg)} .gd{background:#c27a14} .dc{background:#5865f2} .dm{background:transparent;color:var(--ink)!important;border:1.5px solid var(--tg)}
.links a:hover{filter:brightness(1.12)}
.none{color:var(--muted);font-weight:500}
#empty{display:none;color:var(--muted);padding:12px 4px}
dialog{border:1px solid var(--line);border-radius:14px;background:#1c2640;color:var(--ink);padding:0;width:min(760px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(5,8,20,.7)}
.dh{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1c2640;border-bottom:1px solid var(--line);font-weight:800}
.dh button{border:0;background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer}
dialog img{display:block;width:100%;height:auto;background:#fff}
@media (prefers-reduced-motion:reduce){summary::after{transition:none}}

.grp{margin:0 0 6px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.zm{background:#2d8cff}
.person{display:grid;gap:2px}
.role{font-size:13px;color:var(--muted)}
.pname{font-weight:700}
.ph{color:var(--ink);text-decoration:none;font-weight:600}
.person .links{margin-top:6px}
.person+.person{padding-top:14px;border-top:1px solid var(--line)}
.hero>*{animation:rise .95s cubic-bezier(.22,.61,.36,1) both}
.hero>*:nth-child(2){animation-delay:.07s}.hero>*:nth-child(3){animation-delay:.14s}.hero>*:nth-child(4){animation-delay:.21s}
@keyframes rise{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.reveal{opacity:0;transform:translateX(-14px);filter:blur(3px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.22,.61,.36,1),filter .9s ease,border-color .3s}
.reveal.in{opacity:1;transform:none;filter:none}
.links a,#schbtn,#conbtn{transition:transform .3s ease,filter .3s ease}
.links a:active,#schbtn:active,#conbtn:active{transform:scale(.96)}
dialog[open]{animation:pop .6s cubic-bezier(.22,.61,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
dialog[open]::backdrop{animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:560px){
  main{padding:26px 12px 40px}
  .top{flex-direction:column}
  .btns{display:flex;gap:10px}
  #schbtn,#conbtn{flex:1;min-height:46px;padding:12px 10px}
  #search{min-height:46px;font-size:16px}
  summary{padding:15px 14px;font-size:17px}
  .inner{padding:2px 14px 16px}
  .links a{flex:1 1 calc(50% - 5px);justify-content:center;min-height:44px;padding:10px 12px;font-size:14px}
  .sched span{min-width:88px}
  #sch{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;border:0}
  #con{width:calc(100vw - 24px)}
}
@media (prefers-reduced-motion:reduce){
  .hero>*,dialog[open]{animation:none}
  .reveal{opacity:1;transform:none;transition:none}
}
.btns{display:flex;gap:10px}
#conbtn{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
#con{width:min(460px,94vw)}
.dbody{padding:16px;display:grid;gap:16px}
.waves path{animation:sway 15s ease-in-out infinite alternate}
.waves path:nth-child(2){animation-duration:18s;animation-delay:-3s}
.waves path:nth-child(3){animation-duration:21s;animation-delay:-6s}
.waves path:nth-child(4){animation-duration:24s;animation-delay:-2s}
@keyframes sway{from{transform:translateX(-8px)}to{transform:translateX(0)}}
.links a:hover{transform:translateY(-1px)}
.links a:hover .ic{animation:wig .8s ease}
@keyframes wig{30%{transform:rotate(-7deg)}65%{transform:rotate(5deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.waves path,.links a:hover .ic{animation:none}.links a:hover{transform:none}}
</style>
</head>

  <h1>Предметы и преподаватели</h1>

  <div class="top">

  </div>

    <a class="ph" href="tel:${x.tel}">${esc(x.phone)}</a>
    <div class="links">${btn("wa",x.wa,ICON.wa,"WhatsApp")}${x.tg?btn("dm","https://t.me/"+x.tg,ICON.tg,"@"+esc(x.tg)):""}</div>
  </div>`).join("");
list.innerHTML = subjects.map(subjectCard).join("");

// плавное раскрытие и закрытие
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
list.querySelectorAll("details").forEach(d=>{
  const body=d.querySelector(".info");
  d.querySelector("summary").addEventListener("click",e=>{
    e.preventDefault();
    if(d._a) d._a.cancel();
    if(!d.open){
      d.open=true;
      if(reduce) return;
      const h=body.offsetHeight;
      d._a=body.animate([{height:"0px"},{height:h+"px"}],{duration:560,easing:"cubic-bezier(.22,.61,.36,1)"});
      [...body.querySelector(".inner").children].forEach((c,i)=>c.animate([{opacity:0,transform:"translateX(-10px)"},{opacity:1,transform:"none"}],{duration:650,delay:100+i*90,easing:"cubic-bezier(.22,.61,.36,1)",fill:"backwards"}));
      d._a.onfinish=()=>{d._a=null};
    }else{
      if(reduce){d.open=false;return}
      const h=body.offsetHeight;
      d._a=body.animate([{height:h+"px"},{height:"0px"}],{duration:420,easing:"cubic-bezier(.45,0,.25,1)"});
      d._a.onfinish=()=>{d.open=false;d._a=null};
    }
  });
});

// появление карточек при прокрутке
const cards=[...list.querySelectorAll("details")];
if("IntersectionObserver" in window){
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){const t=en.target;t.classList.add("in");io.unobserve(t);setTimeout(()=>t.style.transitionDelay="",1200)}
  }),{threshold:.08});
  cards.forEach((c,i)=>{c.style.transitionDelay=(i%3)*70+"ms";io.observe(c)});
}else cards.forEach(c=>c.classList.add("in"));

// расписание
[["sch","schbtn","schx"],["con","conbtn","conx"]].forEach(([d,o,c])=>{
  const dlg=document.getElementById(d);
  document.getElementById(o).onclick=()=>dlg.showModal();
  document.getElementById(c).onclick=()=>dlg.close();
  dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
});

// поиск
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  cards.forEach(d => {
    const ok = d.dataset.name.includes(q);
    d.style.display = ok ? "" : "none";
    if (ok) shown++;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
});
</script>
</body>
</html>
